<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width" />
  <title>Explore the World</title>
  <link rel="stylesheet"
    href="style.css" />
</head>
<body>
  <main class="hero">
    <img class="bg" alt="" />
    <div class="shade"></div>
    <section class="info">
      <p class="place"></p>
      <h1 class="name"></h1>
      <p class="text"></p>
    </section>

  <button class="prev">←</button>
  <button class="next">→</button>
  <div class="bar"><i></i></div>
  <p class="credit">Photos: Wikimedia
    Commons (see README).</p>
  <script src="main.js"></script>
</body>
</html>
